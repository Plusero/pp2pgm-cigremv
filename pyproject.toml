[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pp2pgm-cigremv"
version = "0.1.0"
description = "Pandapower to Power Grid Model conversion for CIGRE MV."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ipython>=8.12.3",
    "matplotlib>=3.10.5",
    "numpy>=2.3.2",
    "pandapower>=3.1.2",
    "pandas>=2.3.1",
    "power-grid-model>=1.12.0",
    "power-grid-model-ds>=1.4.4",
    "power-grid-model-io>=1.3.7",
    "SciencePlots>=2.1.1",
    "scipy>=1.16.1",
    "seaborn>=0.13.2",
    "sympy>=1.14.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
]

[tool.hatch.build.targets.wheel]
packages = ["modules"]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0",
    "ruff>=0.8",
]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["modules", "tests"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG",    # flake8-unused-arguments
    "SIM",    # flake8-simplify
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # do not perform function calls in argument defaults
]

[tool.ruff.lint.isort]
known-first-party = ["modules"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --tb=short"
